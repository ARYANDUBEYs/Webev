<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <fieldset>
            <table border="2" align="center" width="60%" cellspacing="0" cellpadding="5">
                <form action="">
                    <h1 align="center">Hotel Booking Form</h1>

                    <tr>
                        <td><label for="">Name</label></td>
                        <td>:</td>
                        <td><input type="text" name="" id="" placeholder="Enter your name"></td>
                    </tr>

                    <tr>
                        <td><label for="">E-mail</label></td>
                        <td>:</td>
                        <td><input type="email" name="" id="" placeholder="Enter your email"></td>
                    </tr>

                    <tr>
                        <td><label for="">Phone</label></td>
                        <td>:</td>
                        <td><input type="tel" name="" id="" placeholder="Enter your Phone Number"></td>
                    </tr>

                    <tr>
                        <td><label for="">Check-in-date</label></td>
                        <td>:</td>
                        <td><input type="date" name="" id="" placeholder="Enter your Check-in-date"></td>
                    </tr>

                    <tr>
                        <td><label for="">Check-out-date</label></td>
                        <td>:</td>
                        <td><input type="date" name="" id="" placeholder="Enter your Check-out-date"></td>
                    </tr>

                    <tr>
                        <td><label for="">Room Type</label></td>
                        <td>:</td>
                        <td>
                            <select name="" id="">
                                <option value="single">Single Room</option>
                                <option value="single">Double Room</option>
                                <option value="single">Triple Room</option>

                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="">Number of Guests</label></td>
                        <td>:</td>
                        <td><input type="number" name="" id="" placeholder="Enter number o guests"></td>
                    </tr>
                </form>
                
            </table>
            <p>Special Requests:</p>
            <textarea></textarea>
        </fieldset>
</body>
</html>
