<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASS TIME TABLE</title>
</head>
<body>
    <table border="1">
        <tr>
            <th colspan="7">TIME TABLE</th>
        </tr>
        <tr>
            <th>DAY</th>
            <th>8.00-9.00AM</th>
            <th>9.00-10.00AM</th>
            <th>10.00-11.00AM</th>
            <th>11.00AM-12.00AM</th>
            <th>12.00-13.00AM</th>
            <th>13.00-14.00AM</th>
        </tr>
        <tr>
            <th>MONDAY</th>
            <td rowspan ="2">ENGLISH</td>
            <td colspan ="2">MATH</td>
            <td rowspan="5">RECESS</td>
            <td>SCIENCE</td>
            <td>SPORTS</td>
            

        </tr>
        <tr>
            <th>TUESESDAY</th>
            <td>HINDI</td>
            <td>SANSKRIT</td>
            <td>MATH</td>
            <td>SCIENCE</td>
        </tr>
        <tr>
            <th>WEDNESDAY</th>
            <td colspan ="2" rowspan="2">EVS</td>
            <td>MATH</td>
            <td>SPORTS</td>
            <td>HINDI</td>
        </tr>
        <tr>
            <th>THURSDAY</th>
            <td>ENGLISH</td>
            <td>HINDI</td>
            <td>MATH</td>
        </tr>
        <tr>
            <th>FRIDAY</th>
            <td>ENGLISH</td>
            <td>HINDI</td>
            <td>MATH</td>
            <td>SPORTS</td>
            <td>EVS</td>
        </tr>
        
    </table>
</body>
</html>
